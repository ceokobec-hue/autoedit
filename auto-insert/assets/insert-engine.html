<template id="main-graphics-template">
  <!-- data-duration = 아래 D 배열의 길이 합 + 앞뒤 여백(PAD 0.5 × 2).
       ⛔ D 를 고치면 여기도 같이 고친다. 안 고치면 «남는 시간이 통째로 빈 화면»으로 나간다.
          스크립트가 콘솔에 맞는 값을 찍어 주고, 가능하면 자동으로 맞춰 준다. -->
  <div data-composition-id="main-graphics" data-width="1920" data-height="1080" data-duration="31">
    <style>
      /* 폰트는 «이 파일 옆의 fonts/» 에서 찾는다 = auto-insert/assets/fonts
         (get_fonts.sh 가 $AUTOEDIT_FONTS 로 이어 주는 바로가기).
         다른 프로젝트로 이 파일을 복사했다면 그 프로젝트의 폰트 폴더로 바꾼다. */
      @font-face { font-family: 'Pretendard'; src: url('fonts/Pretendard-Regular.woff2') format('woff2'); font-weight: 400; }
      @font-face { font-family: 'Pretendard'; src: url('fonts/Pretendard-Medium.woff2') format('woff2'); font-weight: 500; }
      @font-face { font-family: 'Pretendard'; src: url('fonts/Pretendard-Bold.woff2') format('woff2'); font-weight: 700; }
      @font-face { font-family: 'Pretendard'; src: url('fonts/Pretendard-Black.woff2') format('woff2'); font-weight: 900; }

      [data-composition-id="main-graphics"] {
        position: absolute; inset: 0; background: #E8E2D6; color: #1A1712;
        font-family: 'Pretendard', sans-serif; word-break: keep-all; overflow: hidden;
      }
      .ov { position: absolute; inset: 0; opacity: 0; z-index: 5; overflow: hidden;
            line-height: normal; letter-spacing: normal; }

      /* ══ 스타일 A · 손끝 브리핑 ══ */
      .sa { background:#E8E2D6; color:#1A1712; }
      .sa .gr { mix-blend-mode: multiply; opacity: .05; }
      .sa .vig { background: radial-gradient(118% 96% at 50% 42%, rgba(0,0,0,0) 58%, rgba(26,23,18,.13) 100%); }
      .sa .bug { color:#1A1712; } .sa .bug .mk5 { --a:#D98A1F; }
      .sa .attr, .sa .epn { color:#6E675C; }
      .sa .t-lab { color:#D98A1F; }
      .sa .t-hero,.sa .t-big,.sa .t-mid,.sa .t-row { color:#1A1712; }
      .sa .t-sub, .sa .t-desc { color:#6E675C; }
      .sa .rule { background:#D98A1F; }
      .sa .card { background:#FCFAF5; border:2px solid rgba(26,23,18,.20);
                  box-shadow: 0 6px 0 #C9C0AE, 0 22px 38px rgba(26,23,18,.15); }
      .sa .divx { background: rgba(26,23,18,.22); }

      /* ══ 스타일 B · 종이극장 ══ */
      .sb { background:#1B2438; color:#F0E6D2; }
      .sb .gr { mix-blend-mode: overlay; opacity: .16; }
      .sb .vig { background: radial-gradient(120% 100% at 50% 44%, rgba(0,0,0,0) 44%, rgba(0,0,0,.52) 100%); }
      .sb .bug { color:#F0E6D2; } .sb .bug .mk5 { --a:#E8442E; }
      .sb .attr, .sb .epn { color:#B9AE93; }
      .sb .t-lab { color:#E8442E; }
      .sb .t-hero,.sb .t-big,.sb .t-mid,.sb .t-row { color:#F0E6D2; }
      .sb .t-sub, .sb .t-desc { color:#B9AE93; }
      .sb .rule { background:#E8442E; }
      .sb .card { background:#F0E6D2; border:2px solid rgba(42,36,25,.20);
                  filter: drop-shadow(10px 16px 0 rgba(0,0,0,.30)); }
      .sb .card .t-row { color:#2A2419; } .sb .card .t-desc { color:#6B6353; }
      .sb .divx { background: rgba(240,230,210,.24); }

      .gr { position:absolute; inset:0; z-index:38; pointer-events:none; background-size:520px 520px;
        background-image: url("data:image/svg+xml,<svg%20xmlns='http://www.w3.org/2000/svg'%20width='520'%20height='520'><filter%20id='pn'><feTurbulence%20type='fractalNoise'%20baseFrequency='0.85'%20numOctaves='2'%20stitchTiles='stitch'/><feColorMatrix%20type='saturate'%20values='0'/></filter><rect%20width='520'%20height='520'%20filter='url(%23pn)'/></svg>"); }
      .vig { position:absolute; inset:0; z-index:37; pointer-events:none; }
      .floor { position:absolute; left:0; right:0; top:900px; bottom:0; z-index:2;
        background: linear-gradient(180deg,#212B42,#161E30); border-top:2px solid rgba(240,230,210,.16); }
      .curt { position:absolute; top:0; bottom:0; width:84px; z-index:50;
        background: repeating-linear-gradient(90deg,#121828 0 22px,#0C1120 22px 44px); box-shadow: 0 0 52px rgba(0,0,0,.6); }
      .spot { position:absolute; inset:0; z-index:3; mix-blend-mode:screen;
        background: radial-gradient(46% 62% at 50% 34%, rgba(255,217,138,.28), rgba(255,217,138,0) 72%); }
      .pup { position:absolute; z-index:20; filter: drop-shadow(10px 16px 0 rgba(0,0,0,.34)); }
      .pup i { position:absolute; background:#F0E6D2; }

      /* ══ 로고 · 크롬 ══ */
      .mk5 { --s:44px; --a:currentColor; display:inline-flex; align-items:flex-end; flex:none;
             gap: calc(var(--s)*.09); width: calc(var(--s)*1.24); height: var(--s); }
      .mk5 i { flex:1; background: currentColor; border-radius: calc(var(--s)*.06); }
      .mk5 i:nth-child(1){height:34%} .mk5 i:nth-child(2){height:60%} .mk5 i:nth-child(3){height:86%;background:var(--a)}
      .bug { position:absolute; left:72px; top:52px; display:flex; align-items:center; gap:18px; z-index:60; }
      .bug .wm1 { display:block; font-size:30px; font-weight:900; letter-spacing:-.028em; line-height:1.16; white-space:nowrap; }
      .bug .wm2 { display:block; font-size:24px; font-weight:500; line-height:1.3; opacity:.72; white-space:nowrap; }
      .attr { position:absolute; left:0; right:0; top:62px; text-align:center; font-size:28px; font-weight:500; letter-spacing:.05em; z-index:60; }
      .epn { position:absolute; right:72px; top:62px; font-size:28px; font-weight:700; letter-spacing:.10em; z-index:60; }

      /* ══ 타이포 ══ */
      .lm { display:block; overflow:hidden; }
      .lm > * { display:block; will-change: transform; }
      .t-hero { font-size:120px; font-weight:900; letter-spacing:-.038em; line-height:1.08; }
      .t-big  { font-size:92px;  font-weight:900; letter-spacing:-.035em; line-height:1.12; }
      .t-row  { font-size:46px;  font-weight:900; letter-spacing:-.022em; line-height:1.24; }
      .t-sub  { font-size:38px;  font-weight:500; line-height:1.42; }
      .t-desc { font-size:30px;  font-weight:500; line-height:1.44; }
      .t-lab  { font-size:28px;  font-weight:700; letter-spacing:.20em; }
      .rule { position:absolute; height:10px; transform-origin:left center; z-index:15; }
      .card { position:absolute; z-index:14; }
      .divx { position:absolute; width:3px; z-index:12; transform-origin:center top; }
      .num { font-size:34px; font-weight:900; line-height:1; letter-spacing:.02em; }
      .sa .num { color:#D98A1F; } .sb .num { color:#E8442E; }
      .arw { position:absolute; width:40px; text-align:center; font-size:44px; font-weight:700; z-index:15; }
      .sa .arw { color:#D98A1F; } .sb .arw { color:#E8442E; }
    </style>
    <div id="ins-root"></div>
    <script>
      /* ══════════════════════════════════════════════════════════════
         인서트 데이터 배열 + 레이아웃 생성기.
         여러 씬을 손으로 쓰면 용어가 어긋나므로 「하나의 데이터 · 하나의 생성기」로 간다.
         레이아웃 5종: hero / list / vs / chain / stack
         모든 트윈은 (길이 - 1.2s) 안에 끝난다 = 프리즈홀드.
         ══════════════════════════════════════════════════════════════ */
      /* ── 예시 데이터 6컷 ──
         레이아웃 5종(hero / list / vs / chain / stack)이 어떻게 나오는지 보여주는 견본이다.
         실제로 쓸 때는 이 배열만 내 회차 내용으로 갈아끼우면 된다. 생성기는 손대지 않는다.
         d = 길이(초) · s = 스타일(a/b) · L = 레이아웃 · k = 머리말 · h = 큰 글씨 · sub = 부연 */
      var D = [
        {id:'INS-01',d:4,s:'b',L:'hero',pup:1,k:'머리말이 여기',h:['큰 글씨 한 줄'],sub:'부연 설명은 이 자리에 들어갑니다'},
        {id:'INS-02',d:5,s:'b',L:'hero',k:'두 줄도 됩니다',h:['첫째 줄','둘째 줄'],sub:'줄바꿈은 배열로 준다'},
        {id:'INS-03',d:5,s:'a',L:'list',k:'목록 레이아웃',h:['항목을 세운다'],
          it:[{n:'①',t:'첫째',d:'설명이 여기 붙는다'},{n:'②',t:'둘째',d:'번호는 있어도 없어도 된다'},
              {n:'③',t:'셋째',d:'세 개까지가 읽기 편하다'}]},
        {id:'INS-04',d:5,s:'a',L:'vs',k:'둘을 견준다',h:['이건 이렇게'],
          it:[{t:'○ 이렇게',d:'권하는 쪽'},{t:'✕ 저렇게',d:'피하는 쪽'}]},
        {id:'INS-05',d:5,s:'b',L:'chain',k:'차례를 보인다',h:['하나씩 이어서'],
          it:[{t:'첫 단계',d:'여기서 시작'},{t:'둘째',d:'이어서'},{t:'셋째',d:'그다음'},{t:'마지막',d:'여기가 끝',hl:1}]},   /* chain 은 4칸 고정 */
        {id:'INS-06',d:6,s:'a',L:'stack',k:'쌓아 올린다',h:['층으로 보여줄 때'],
          it:[{t:'위층',d:'가장 나중'},{t:'아래층',d:'가장 먼저'}]}
      ];

      /* ⛔ 길이를 손으로 적어 두면 D 를 고쳤을 때 «남는 시간이 빈 화면»으로 나간다 → D 에서 계산한다. */
      var PAD = 0.5, TOTAL = PAD * 2;
      for (var _z = 0; _z < D.length; _z++) TOTAL += D[_z].d;
      (function () {
        var el = document.querySelector('[data-composition-id="main-graphics"]');
        var cur = el && Number(el.getAttribute('data-duration'));
        if (el && cur !== TOTAL) {
          el.setAttribute('data-duration', String(TOTAL));
          console.warn('[insert-engine] 길이가 안 맞습니다: 표기 ' + cur + '초 · 실제 ' + TOTAL +
                       '초 → 맞췄습니다. index-template.html 의 data-duration 3곳도 ' + TOTAL + ' 로 바꾸세요.');
        }
      })();
      var esc = function (s) { return String(s == null ? '' : s); };
      var PUPH = '<i style="left:62px;top:0;width:76px;height:76px;border-radius:50%"></i>'
        + '<i style="left:44px;top:88px;width:112px;height:150px;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)"></i>'
        + '<i style="left:24px;top:96px;width:26px;height:112px;border-radius:13px;transform:rotate(13deg)"></i>'
        + '<i style="left:150px;top:96px;width:26px;height:112px;border-radius:13px;transform:rotate(-13deg)"></i>'
        + '<i style="left:62px;top:238px;width:26px;height:122px;border-radius:13px"></i>'
        + '<i style="left:112px;top:238px;width:26px;height:122px;border-radius:13px"></i>';
      var CHROME = '<div class="bug"><span class="mk5"><i></i><i></i><i></i></span>'
        + '<span><span class="wm1">시리즈 이름</span><span class="wm2">부제가 여기</span></span></div>'
        + '<div class="attr">채널 이름 — 자료 성격</div><div class="epn">시리즈 · 3편</div>'
        + '<div class="vig"></div><div class="gr"></div>';

      /* 항목 가로 배치 좌표 — 개수별로 고정 */
      var COLS = {
        2: { w: 800, x: [128, 992] },
        3: { w: 520, x: [128, 694, 1260] },
        4: { w: 386, x: [128, 554, 980, 1406] }
      };

      function build(e) {
        var id = e.id.replace('INS-', 'p'), s = [];
        s.push('<div class="ov s' + e.s + '" id="' + id + '">');
        if (e.s === 'b') s.push('<div class="spot" id="' + id + '-spot"></div><div class="floor"></div>');
        if (e.s === 'b' && e.pup)
          s.push('<div class="pup" id="' + id + '-pup" style="left:1560px;top:540px;width:200px;height:360px">' + PUPH + '</div>');

        var isHero = e.L === 'hero';
        var kickTop = isHero ? 200 : 176;
        var headTop = isHero ? 258 : 228;
        s.push('<div class="t-lab" id="' + id + '-k" style="position:absolute;left:128px;top:' + kickTop + 'px;z-index:30">' + esc(e.k) + '</div>');

        var n = e.h.length, hCls = isHero ? 't-hero' : 't-big', hH = isHero ? 152 : 124;
        for (var i = 0; i < n; i++) {
          s.push('<div class="lm" style="position:absolute;left:124px;top:' + (headTop + i * hH) + 'px;width:1660px;height:' + hH + 'px;z-index:30">'
            + '<span class="' + hCls + '" id="' + id + '-h' + i + '">' + esc(e.h[i]) + '</span></div>');
        }
        var afterHead = headTop + n * hH;
        var ruleTop = isHero ? afterHead + 30 : afterHead + 14;
        s.push('<div class="rule" id="' + id + '-r" style="left:128px;top:' + ruleTop + 'px;width:300px"></div>');

        if (isHero) {
          s.push('<div class="t-sub" id="' + id + '-s" style="position:absolute;left:128px;top:' + (ruleTop + 42) + 'px;width:1660px;z-index:30">' + esc(e.sub) + '</div>');
        } else {
          var subTop = ruleTop + 40, itTop = 452;
          if (e.sub) s.push('<div class="t-sub" id="' + id + '-s" style="position:absolute;left:128px;top:' + subTop + 'px;width:1660px;z-index:30">' + esc(e.sub) + '</div>');

          if (e.L === 'vs') {
            itTop = 496;
            s.push('<div class="divx" id="' + id + '-dv" style="left:958px;top:' + itTop + 'px;height:344px"></div>');
            var vx = [128, 1012], vw = 780;
            for (var j = 0; j < 2; j++) {
              s.push('<div class="card" id="' + id + '-i' + j + '" style="left:' + vx[j] + 'px;top:' + itTop + 'px;width:' + vw + 'px;height:344px">'
                + '<div class="t-row" style="position:absolute;left:44px;top:44px;width:' + (vw - 88) + 'px">' + esc(e.it[j].t) + '</div>'
                + '<div class="t-desc" style="position:absolute;left:44px;top:150px;width:' + (vw - 88) + 'px">' + esc(e.it[j].d) + '</div></div>');
            }
          } else if (e.L === 'chain') {
            var c4 = COLS[4];
            for (var q = 0; q < 4; q++) {
              s.push('<div class="card" id="' + id + '-i' + q + '" style="left:' + c4.x[q] + 'px;top:552px;width:' + c4.w + 'px;height:272px'
                + (e.it[q].hl ? ';border-color:#D98A1F;border-width:4px' : '') + '">'
                + '<div class="t-row" style="position:absolute;left:0;right:0;top:66px;text-align:center'
                + (e.it[q].hl ? ';color:#D98A1F' : '') + '">' + esc(e.it[q].t) + '</div>'
                + '<div class="t-desc" style="position:absolute;left:0;right:0;top:140px;text-align:center">' + esc(e.it[q].d) + '</div></div>');
              if (q < 3) s.push('<div class="arw" id="' + id + '-a' + q + '" style="left:' + (c4.x[q] + c4.w + 3) + 'px;top:658px">→</div>');
            }
          } else if (e.L === 'stack') {
            for (var r = 0; r < e.it.length; r++) {
              s.push('<div class="card" id="' + id + '-i' + r + '" style="left:128px;top:' + (452 + r * 116) + 'px;width:1664px;height:100px">'
                + '<div class="t-row" style="position:absolute;left:40px;top:24px">' + esc(e.it[r].t) + '</div>'
                + '<div class="t-desc" style="position:absolute;right:40px;top:32px;text-align:right">' + esc(e.it[r].d) + '</div></div>');
            }
          } else { /* list / list4 */
            var cn = e.L === 'list4' ? 4 : e.it.length, C = COLS[cn], ih = e.sub ? 290 : 340, iy = e.sub ? 550 : 496;
            for (var k2 = 0; k2 < cn; k2++) {
              var it = e.it[k2], inner = '', pl = it.c ? 52 : 36;
              if (it.n) inner += '<div class="num" style="position:absolute;left:' + pl + 'px;top:34px">' + esc(it.n) + '</div>';
              inner += '<div class="t-row" style="position:absolute;left:' + pl + 'px;top:' + (it.n ? 86 : 44) + 'px;width:' + (C.w - pl - 36) + 'px'
                + (it.c ? ';color:' + it.c : '') + '">' + esc(it.t) + '</div>';
              if (it.d) inner += '<div class="t-desc" style="position:absolute;left:' + pl + 'px;top:' + (it.n ? 150 : 116) + 'px;width:' + (C.w - pl - 36) + 'px">' + esc(it.d) + '</div>';
              s.push('<div class="card" id="' + id + '-i' + k2 + '" style="left:' + C.x[k2] + 'px;top:' + iy + 'px;width:' + C.w + 'px;height:' + ih + 'px'
                + (it.c ? ';border-left:16px solid ' + it.c : '') + '">' + inner + '</div>');
            }
          }
        }
        if (e.s === 'b') s.push('<div class="curt" style="left:0"></div><div class="curt" style="right:0"></div>');
        s.push(CHROME + '</div>');
        return s.join('');
      }

      document.getElementById('ins-root').innerHTML = D.map(build).join('');

      /* ── 타임라인 ── */
      var tl = gsap.timeline({ paused: true });
      var t = PAD, SC = [];
      for (var z = 0; z < D.length; z++) { SC.push([D[z].id.replace('INS-', 'p'), t, t + D[z].d]); t += D[z].d; }
      SC.forEach(function (p) {
        if (p[1] > 0) tl.set('#' + p[0], { opacity: 0 }, 0);
        tl.set('#' + p[0], { opacity: 1 }, p[1]);
        if (p[2] < TOTAL) tl.set('#' + p[0], { opacity: 0 }, p[2]);
      });

      function soft(sel, at, o) { o = o || {};
        tl.set(sel, { opacity: 0, y: (o.y === undefined ? 28 : o.y), x: o.x || 0 }, 0);
        tl.to(sel, { opacity: 1, y: 0, x: 0, duration: o.d || 0.55, ease: 'expo.out' }, at); }
      function rise(sel, at, o) { o = o || {};
        tl.set(sel, { yPercent: 116 }, 0);
        tl.to(sel, { yPercent: 0, duration: o.d || 0.62, ease: 'expo.out' }, at); }
      function ruleDraw(sel, at) { tl.set(sel, { scaleX: 0 }, 0);
        tl.to(sel, { scaleX: 1, duration: 0.52, ease: 'power4.inOut' }, at); }
      function drawY(sel, at) { tl.set(sel, { scaleY: 0 }, 0);
        tl.to(sel, { scaleY: 1, duration: 0.5, ease: 'power4.inOut' }, at); }
      function popc(sel, at, o) { o = o || {};
        tl.set(sel, { opacity: 0, scale: o.s0 || 0.92 }, 0);
        tl.to(sel, { opacity: 1, scale: 1, duration: o.d || 0.46, ease: 'expo.out' }, at); }
      function fadeIn(sel, at, o) { o = o || {};
        tl.set(sel, { opacity: 0 }, 0);
        tl.to(sel, { opacity: 1, duration: (o && o.d) || 0.55, ease: 'power1.out' }, at); }
      function walk(sel, at, from, dur) {
        tl.set(sel, { opacity: 0, x: from }, 0);
        tl.to(sel, { opacity: 1, duration: 0.28, ease: 'power2.out' }, at);
        tl.to(sel, { x: 0, duration: dur, ease: 'power2.out' }, at); }

      for (var m = 0; m < D.length; m++) {
        var e = D[m], id = '#' + D[m].id.replace('INS-', 'p'), t0 = SC[m][1];
        if (e.s === 'b') fadeIn(id + '-spot', t0 + 0.00, { d: 0.55 });
        if (e.s === 'b' && e.pup) walk(id + '-pup', t0 + 0.14, 460, 0.95);
        soft(id + '-k', t0 + 0.10, { y: 22, d: 0.44 });
        for (var hh = 0; hh < e.h.length; hh++) rise(id + '-h' + hh, t0 + 0.24 + hh * 0.18, { d: 0.62 });
        var base = 0.24 + e.h.length * 0.18;
        ruleDraw(id + '-r', t0 + base + 0.34);
        if (e.L === 'hero') { soft(id + '-s', t0 + base + 0.56, { y: 22, d: 0.50 }); }
        else {
          if (e.sub) soft(id + '-s', t0 + base + 0.54, { y: 20, d: 0.46 });
          var st = t0 + base + (e.sub ? 0.78 : 0.62);
          if (e.L === 'vs') {
            drawY(id + '-dv', st);
            soft(id + '-i0', st + 0.12, { x: -60, y: 0, d: 0.55 });
